<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — SethStore</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="auth-page">
  <div class="auth-card">
    <h1>Create account</h1>
    <form id="signup-form">
      <label>Full name
        <input type="text" id="full_name" autocomplete="name" required>
      </label>
      <label>Email
        <input type="email" id="email" autocomplete="email" required>
      </label>
      <label>Password
        <input type="password" id="password" autocomplete="new-password" minlength="10" required>
      </label>
      <button type="submit" id="submit-btn">Sign up</button>
    </form>
    <p id="error" class="error" hidden></p>
    <p class="link">Already have an account? <a href="/login">Log in</a></p>
  </div>
  <script src="/static/auth.js"></script>
</body>
</html>
