<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account scheduled for deletion — SethStore</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="auth-page">
  <div class="auth-card">
    <h1>Account scheduled for deletion</h1>
    <p class="muted" style="margin-bottom:1.25rem;">
      Your account has been scheduled for permanent deletion in <strong>7 days</strong>.
      Until then, you can restore it by logging in with the same email and password.
    </p>
    <p class="muted small" style="margin-bottom:1.5rem;">
      After 7 days it will be permanently removed and cannot be recovered.
    </p>
    <a href="/login" class="btn-primary" style="display:block;text-align:center;text-decoration:none;">
      Restore by logging in
    </a>
    <p class="link" style="margin-top:1.25rem;">
      <a href="/">Back to shop</a>
    </p>
  </div>
  <script src="/static/auth.js"></script>
</body>
</html>
